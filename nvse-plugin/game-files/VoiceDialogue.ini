; Defaults. If you use the MCM menu (The Mod Configuration Menu + MCM Extender), its settings
; in Data\config\SpeakUpCourier\settings.ini override listen mode, keys, timing and miss feedback.

[General]
; auto = listen the whole time dialogue options are on screen (just talk).
; push = only listen while PushToTalkKey is held.
ListenMode=auto
; Key to hold while speaking in push mode (Windows virtual-key code).
; 0xA3 = Right Ctrl (unbound in New Vegas). 0x05 = mouse button 4, 0x06 = mouse button 5.
PushToTalkKey=0xA3
; Press in game to switch between auto and push-to-talk. 0x79 = F10.
ToggleKey=0x79

; Speech helper and model, relative to this folder.
HelperExe=helper\vdm_helper.exe
Model=model

; Shown when the mod didn't catch what you said. Clicking an option still works.
MissMessage=Say that again?
; The NPC's "hm?" when the mod didn't catch you (files relative to this folder, "none" = silent).
HmMale=sounds\hm_male.wav
HmFemale=sounds\hm_female.wav
; Used for voice types with "Robot" in the name (Mr. Handy, Protectron, ...).
HmRobotMale=sounds\hm_robot_male.wav
HmRobotFemale=sounds\hm_robot_female.wav
; Optional sound form editor ID to play with the message, e.g. UIPopUpMessageGeneral.
MissSound=
; How long the chosen line stays highlighted before it is clicked (ms), so it looks clicked. 0 = instant.
ClickDelayMs=250
; 1 = add what the mod heard to the message (handy while testing).
ShowHeard=0

[Sounds]
; Per voice type "hm?", so it matches the NPC's actor. Key = voice type editor ID.
; Anything not listed uses HmMale / HmFemale above.
; MaleAdult01Default=sounds\MaleAdult01Default.wav
; FemaleAdult01Default=sounds\FemaleAdult01Default.wav

[SoundForms]
; Per voice type "hm?" using one of the game's own sounds (sound form editor ID),
; played from the game's archives at the NPC. Wins over [Sounds] and the files above.
RobotEDE=NPCRobotEdECurious
NVDLC04RobotEdE=NPCRobotEdECurious
RobotUniqueRex=NPCDogRexSitUp
